spring:
  application:
    name: main-service
  datasource:
    username: epamtrainee
    password: epamtraineepassword
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/test_epam_training_app
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: db/changelog/db.test-changelog-master.yaml
  config:
    import: classpath:secretTest.yaml
JWT:
  secret-key: ${JWT.secret-key}
my-props:
  jwt:
    max-attempts: 3
    cold-pause-min: 5
server:
  port: 8081
springdoc:
  swagger-ui:
    disable-swagger-default-url: false
    config-url: /v3/api-docs